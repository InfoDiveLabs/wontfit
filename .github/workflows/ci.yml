name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unittest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest -v
      - name: Install and smoke-test the CLI
        run: |
          python -m pip install --quiet .
          phoneframes --version
          python -m phoneframes --help > /dev/null

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff
      - run: ruff check .
      - run: ruff format --check .
