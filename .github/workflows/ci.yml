name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unittest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest -v
      - name: Install and smoke-test the CLI
        run: |
          python -m pip install --quiet .
          wontfit --version
          python -m wontfit --help > /dev/null

  browser:
    name: diagnostics in chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet . playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest -v tests.test_diagnostics

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet ruff
      - run: ruff check .
      - run: ruff format --check .
