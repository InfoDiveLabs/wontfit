[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wontfit"
version = "0.2.0"
description = "See your running app at phone and tablet widths side by side, and find out what won't fit before your users do."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "InfoDive Labs", email = "contact@infodivelabs.com" }]
requires-python = ">=3.9"
keywords = ["responsive", "mobile", "preview", "proxy", "iframe", "devtools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.optional-dependencies]
shoot = ["playwright>=1.40"]
dev = ["ruff"]

[project.scripts]
wontfit = "wontfit.cli:main"

[project.urls]
Homepage = "https://github.com/InfoDiveLabs/wontfit"
Repository = "https://github.com/InfoDiveLabs/wontfit"
Issues = "https://github.com/InfoDiveLabs/wontfit/issues"
Changelog = "https://github.com/InfoDiveLabs/wontfit/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["wontfit"]

[tool.setuptools.package-data]
wontfit = ["assets/*.html", "assets/*.js"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
# N815: http.server dispatches on do_GET / do_POST; the names are not ours to choose.
ignore = ["N815"]
